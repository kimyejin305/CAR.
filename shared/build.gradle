plugins {
    id 'com.android.library'
    id("org.jetbrains.kotlin.plugin.compose")
}
android {
    namespace 'com.example.pleoscar.shared'
    compileSdk 37

    defaultConfig {
        minSdk 34
        targetSdk 37

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        android {
            // ... 기존 설정들 ...

            // [핵심 1] Jetpack Compose 기능 활성화
            buildFeatures {
                compose = true
            }

            // (만약 composeOptions 설정이 필요하다면 Kotlin 컴파일러 버전에 맞게 연동됩니다)
        }
    }
}
dependencies {
    implementation libs.androidx.app
    // Firebase 라이브러리 버전 관리
    implementation platform('com.google.firebase:firebase-bom:34.4.0')

    // 음악 핀 저장 및 실시간 조회
    implementation 'com.google.firebase:firebase-firestore'

    // 사용자 익명 로그인
    implementation 'com.google.firebase:firebase-auth'

    // Kotlin 코루틴과 Firebase 연동
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'
    // 네이버 지도 SDK
    implementation 'com.naver.maps:map-sdk:3.23.0'
    // 현재 위치(GPS) 조회를 위한 Google Play Services Location
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation("androidx.media:media:1.7.0")
    dependencies {
        // Firebase Firestore (버전을 직접 명시하여 빌드 안정성 확보)
        implementation 'com.google.firebase:firebase-firestore-ktx:24.10.0'

        // Jetpack Compose BOM 및 UI 라이브러리
        implementation platform('androidx.compose:compose-bom:2024.04.01')
        implementation 'androidx.compose.ui:ui'
        implementation 'androidx.compose.ui:ui-graphics'
        implementation 'androidx.compose.ui:ui-tooling-preview'
        implementation 'androidx.compose.material3:material3'
        implementation 'androidx.compose.foundation:foundation'
        implementation("androidx.media:media:1.7.0")
    }
}